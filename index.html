<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Test Giveaway</title>
    <meta
      name="description"
      content="Event kiosk for a typing-speed challenge: register your WPM score for a chance to win a prize."
    />
    <meta name="theme-color" content="#0f2a44" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Typing Test Giveaway" />
    <meta
      property="og:description"
      content="Event kiosk for a typing-speed challenge: register your WPM score for a chance to win a prize."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles/home.css" />
  </head>
  <body class="home">
    <div class="video-container" aria-hidden="true">
      <video id="background-video" muted playsinline preload="auto"></video>
    </div>
    <div class="overlay" id="overlay" aria-hidden="true"></div>

    <main class="content">
      <h1 class="visually-hidden">Typing Test Giveaway</h1>
      <div class="fallback-hero">
        <p>Typing speed challenge</p>
        <h2>How fast can you type?</h2>
        <p>Take the typing test, then register your score for a chance to win.</p>
      </div>
      <nav class="actions" id="actions" aria-label="Kiosk actions">
        <a href="/register.html" class="btn btn-primary">Enter User Details</a>
        <a
          href="#"
          class="btn btn-secondary"
          id="learn-more"
          target="_blank"
          rel="noopener noreferrer"
          hidden
        ></a>
      </nav>
      <p class="kiosk-hint">Press <kbd>L</kbd> to show or hide the buttons.</p>
    </main>

    <script type="module" src="/src/home.js"></script>
  </body>
</html>
