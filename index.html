<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    
    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }
    
    .video-container video {
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
    }
    
    .content {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 50px;
      z-index: 1;
    }
    
    .buttons-container {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
    }
    
    .btn {
      margin: 0 10px;
      padding: 10px 20px;
      font-size: 1.2em;
      font-weight: 500;
      border-radius: 25px;
    }
    
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.3);
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="video-container">
    <video autoplay muted id="background-video">
      <source src="VideoPlayback.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
  
  <div class="overlay"></div>
  
  <div class="content">
    <div class="buttons-container">
      <a href="send_formdata_to_excel.html" class="btn btn-primary">Enter User Details</a>
      <a href="https://www.logitech.com/en-in/mx/master-series.html" class="btn btn-secondary" id="learn-more" target="_blank">Know More About MX Series</a>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  
  <script>
    // Removed the event listener that prevented navigation and showed an alert
    
    // Ensure video plays on mobile devices when possible
    document.addEventListener('DOMContentLoaded', function() {
      const video = document.getElementById('background-video');
      
      // Define video playlist
      const videoPlaylist = [
        "VideoPlayback.mp4",
        "Video Playback(1).mp4",
        "Video Playback(2).mp4"
      ];
      let currentVideoIndex = 0;
      
      // Function to play the next video
      function playNextVideo() {
        currentVideoIndex = (currentVideoIndex + 1) % videoPlaylist.length;
        video.src = videoPlaylist[currentVideoIndex];
        video.play().catch(error => {
          console.log("Video autoplay was prevented by browser", error);
        });
      }
      
      // Add event listener for when the current video ends
      video.addEventListener('ended', playNextVideo);
      
      // Play video when page is visible
      if (typeof document.hidden !== 'undefined') {
        document.addEventListener('visibilitychange', function() {
          if (!document.hidden) {
            video.play();
          }
        });
      }
      
      // Try to play video immediately
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          // Auto-play was prevented
          console.log("Video autoplay was prevented by browser");
        });
      }
      
      // Add event listener for 'l' key press to toggle buttons visibility
      let buttonsVisible = true;
      document.addEventListener('keydown', function(event) {
        if (event.key === 'l' || event.key === 'L') {
          // Toggle the buttons container visibility
          const buttonsContainer = document.querySelector('.buttons-container');
          if (buttonsContainer) {
            buttonsVisible = !buttonsVisible;
            buttonsContainer.style.display = buttonsVisible ? 'block' : 'none';
          }
          
          // Toggle the overlay opacity
          const overlay = document.querySelector('.overlay');
          if (overlay) {
            overlay.style.backgroundColor = buttonsVisible ? 'rgba(0, 0, 0, 0.3)' : 'rgba(0, 0, 0, 0)';
          }
        }
      });
    });
  </script>
</body>
</html>
